services:
  auth-service:
    build: microservices/auth-service
    mem_limit: 512m
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/
    volumes:
      - ./k8s/auth/config/application-dev.yml:/config/application-dev.yml:ro
  course-composite-service:
    build: microservices/course-composite-service
    image: vitamax/course-composite-service:1.0
    mem_limit: 512m
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/
      - SPRING_PROFILES_ACTIVE=dev
      - RABBITMQ_HOST=rabbitmq
    volumes:
      - ./k8s/course-composite/config/application-dev.yml:/config/application-dev.yml:ro
  course-service:
    build: microservices/course-service
    image: vitamax/course-service:1.0
    mem_limit: 512m
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_HOST=mongodb
      - RABBITMQ_HOST=rabbitmq
    volumes:
      - ./k8s/course/config/application-dev.yml:/config/application-dev.yml:ro
    depends_on:
      mongodb:
        condition: service_healthy
  recommendation-service:
    build: microservices/recommendation-service
    image: vitamax/recommendation-service:1.0
    mem_limit: 512m
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/
      - SPRING_PROFILES_ACTIVE=dev
      - MONGODB_HOST=mongodb
      - RABBITMQ_HOST=rabbitmq
    volumes:
      - ./k8s/recommendation/config/application-dev.yml:/config/application-dev.yml:ro
    depends_on:
      mongodb:
        condition: service_healthy
  review-service:
    build: microservices/review-service
    image: vitamax/review-service:1.0
    mem_limit: 512m
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/
      - SPRING_PROFILES_ACTIVE=dev
      - POSTGRESQL_HOST=postgresql
      - RABBITMQ_HOST=rabbitmq
    volumes:
      - ./k8s/review/config/application-dev.yml:/config/application-dev.yml:ro
    depends_on:
      postgresql:
        condition: service_healthy
  gateway-service:
    build: microservices/gateway-service
    image: vitamax/gateway-service:1.0
    mem_limit: 512m
    environment:
      - SPRING_CONFIG_ADDITIONAL_LOCATION=file:/config/
      - SPRING_PROFILES_ACTIVE=dev
    volumes:
      - ./k8s/gateway/config/application-dev.yml:/config/application-dev.yml:ro
    ports:
      - "8443:80"
  mongodb:
    image: mongo:noble
    mem_limit: 512m
    environment:
      MONGO_INITDB_ROOT_USERNAME: username
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username username --password password --authenticationDatabase admin --eval \"db.adminCommand('ping').ok === 1 || quit(1)\""
        ]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 10s
    volumes:
      - mongo_data:/data/db
      - ./data-init/mongodb:/docker-entrypoint-initdb.d

  postgresql:
    image: postgres
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./data-init/postgresql:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 5s
      timeout: 2s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mongo_data:
  postgres_data:
  rabbitmq_data:
