server.port: 80

app:
  auth:
    host: auth-service
    port: 80
  course-composite:
    uri: http://course-composite-service

management:
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: "readinessState"

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
